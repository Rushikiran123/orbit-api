[project]
name = "orbit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "bcrypt<4.1",
    "fastapi>=0.115,<0.130",
    "passlib[bcrypt]>=1.7",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.8",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "testcontainers[postgresql]>=4.7",
]

[project.scripts]
orbit = "orbit.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=orbit --cov-report=term-missing"

[tool.coverage.run]
source = ["orbit"]
omit = ["*/migrations/*", "*/cli.py"]
# SQLAlchemy's async layer bridges to the sync driver via greenlets, so service
# and router bodies awaiting the DB execute inside spawned greenlets. Without
# greenlet (and thread) concurrency tracing, coverage silently misses those
# lines and drastically under-reports real coverage.
concurrency = ["thread", "greenlet"]
